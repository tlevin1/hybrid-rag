name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # CPU-only PyTorch: the reranker tests use a tiny model built in the test.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.19.0

      # Offline: a deterministic embedding, a fake LLM and a tiny randomly initialized
      # BERT stand in for the real models, so no downloads and no API key.
      - name: Run tests
        run: python -m pytest -q
