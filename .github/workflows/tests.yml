name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real MongoDB for the trace-store tests (tests/test_traces.py).
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # CPU-only PyTorch: the reranker tests use a tiny model built in the test.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.19.0
          pip install -r requirements-azure.txt  # Azure tests use a fake client; no credentials

      # Offline: a deterministic embedding, a fake LLM and a tiny randomly initialized
      # BERT stand in for the real models, so no downloads and no API key.
      - name: Run tests
        run: python -m pytest -q
